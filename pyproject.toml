[project]
name = "mdl-layerif"
version = "0.1.0"
description = "MDL core environment for curvature-weighted layer importance scoring"
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.2",
    "scipy>=1.15",
    "matplotlib>=3.10",
    "pandas>=2.3",
    "scikit-learn>=1.7",
    "weightwatcher>=0.7.5",
    "safetensors>=0.6",
    "powerlaw>=1.5",
    "tqdm>=4.67",
    "pillow>=12.0",
]

[tool.uv]
python-version = "3.10"
